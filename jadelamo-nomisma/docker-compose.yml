version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jadelamo-nomisma_frontend_1
      APP_PORT: 80

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nomisma
      POSTGRES_PASSWORD: ${NOMISMA_DB_PASSWORD:-change-this-password}
      POSTGRES_DB: nomisma
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomisma -d nomisma"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/nerusete/jadelamo-nomisma-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nomisma:${NOMISMA_DB_PASSWORD:-change-this-password}@db:5432/nomisma
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_VERSION: ${GEMINI_API_VERSION:-v1beta}
      GEMINI_ESTIMATE_MODEL: ${GEMINI_ESTIMATE_MODEL:-gemini-2.5-flash}
      GEMINI_ESTIMATE_API_VERSION: ${GEMINI_ESTIMATE_API_VERSION:-v1beta}
      SECRET_KEY: ${SECRET_KEY:-jadelamo-nomisma-change-this-secret}
      FRONTEND_URL: http://frontend
    volumes:
      - ${APP_DATA_DIR}/images:/app/images
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/nerusete/jadelamo-nomisma-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend

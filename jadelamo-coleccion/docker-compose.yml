services:
  app_proxy:
    environment:
      APP_HOST: jadelamo-coleccion_coleccion_1
      APP_PORT: 41100

  coleccion:
    image: ghcr.io/nerusete/jadelamo-coleccion:1.0.0
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/Madrid
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

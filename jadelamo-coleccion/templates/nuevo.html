<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Añadir pieza</title><style>body{font-family:system-ui;background:#f4f5f7;margin:0}.wrap{max-width:800px;margin:30px auto;padding:20px}.box{background:#fff;border-radius:15px;padding:25px}label{display:block;font-weight:600;margin:13px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.btn{margin-top:20px;background:#222;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="box"><h1>➕ Añadir pieza</h1><form method="post" enctype="multipart/form-data"><div class="row"><div><label>Tipo</label><select name="tipo"><option>Moneda</option><option>Billete</option></select></div><div><label>País</label><input name="pais"></div></div><div class="row"><div><label>Valor facial</label><input name="valor" placeholder="2 €"></div><div><label>Año</label><input name="anio"></div></div><div class="row"><div><label>Ceca</label><input name="ceca"></div><div><label>Material</label><input name="material"></div></div><div class="row"><div><label>Conservación</label><input name="conservacion" placeholder="SC, EBC, MBC..."></div><div><label>Cantidad</label><input name="cantidad" type="number" min="1" value="1"></div></div><div class="row"><div><label>Precio de compra (€)</label><input name="precio_compra" type="number" step="0.01"></div><div><label>Valor actual (€)</label><input name="valor_actual" type="number" step="0.01"></div></div><div class="row"><div><label>Anverso</label><input name="anverso" type="file" accept="image/*"></div><div><label>Reverso</label><input name="reverso" type="file" accept="image/*"></div></div><label>Notas</label><textarea name="notas"></textarea><button class="btn">Guardar pieza</button> <a href="/" style="margin-left:12px">Cancelar</a></form></div></main></body></html>

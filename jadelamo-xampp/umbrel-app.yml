manifestVersion: 1

id: jadelamo-xampp
name: XAMPP
tagline: Servidor Apache, PHP, MySQL y phpMyAdmin
icon: https://upload.wikimedia.org/wikipedia/en/thumb/7/78/XAMPP_logo.svg/640px-XAMPP_logo.svg.png
category: Developer Tools
version: "1.0.1"
port: 41062

description: >-
  XAMPP es un entorno de desarrollo que incluye Apache, PHP, MySQL
  y phpMyAdmin en un único contenedor.

  Permite desarrollar y probar páginas web y aplicaciones PHP
  directamente desde tu Umbrel.

  Los archivos de tus páginas web se almacenan en:
  /home/umbrel/umbrel/home/htdocs

developer: Apache Friends
website: https://www.apachefriends.org/
repo: https://github.com/tomsik68/docker-xampp
support: https://github.com/tomsik68/docker-xampp/issues
submitter: Nerusete
submission: https://github.com/Nerusete/umbrel

gallery: []

releaseNotes: >-
  Versión 1.0.1. Instalación simplificada siguiendo el modelo
  de las aplicaciones JADELAMO que funcionan correctamente.

dependencies: []

path: ""

defaultUsername: ""
defaultPassword: ""

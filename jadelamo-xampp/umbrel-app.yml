manifestVersion: 1

id: jadelamo-xampp
name: XAMPP
tagline: Apache, PHP 8.3, MariaDB and phpMyAdmin
icon: https://raw.githubusercontent.com/Nerusete/umbrel/main/jadelamo-xampp/icon.svg
category: developer
version: "2.0.0"
port: 41062

description: >-
  Complete PHP development environment with Apache, PHP 8.3,
  MariaDB and phpMyAdmin.

  Includes PHP extensions for MySQL, GD, ZIP, mbstring, Intl,
  EXIF and OPcache.

  Websites are stored in the Umbrel storage htdocs folder.

developer: Nerusete
website: https://www.apachefriends.org/
submitter: Nerusete
submission: https://github.com/Nerusete/umbrel
repo: https://github.com/Nerusete/umbrel
support: https://github.com/Nerusete/umbrel/issues

gallery: []

releaseNotes: >-
  New XAMPP implementation for umbrelOS 2.0.
  Replaces the old tomsik68/xampp image with a custom
  PHP 8.3 Apache image and MariaDB.
  Supports AMD64 and ARM64.

dependencies: []
path: ""
defaultUsername: "root"
defaultPassword: "12345678"

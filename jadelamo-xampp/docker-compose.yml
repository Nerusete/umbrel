version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: jadelamo-xampp_web_1
      APP_PORT: 80

  web:
    image: marekr76/xampp:latest
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/htdocs:/opt/lampp/htdocs
      - ${APP_DATA_DIR}/data/mysql:/opt/lampp/var/mysql

version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: jadelamo-xampp_app_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  app:
    image: tomsik68/xampp:8.2.12
    restart: unless-stopped
    init: true
    volumes:
      - ${UMBREL_ROOT}/data/storage/htdocs:/opt/lampp/htdocs:rw
      - ${UMBREL_ROOT}/data/storage/xampp-mysql:/opt/lampp/var/mysql:rw

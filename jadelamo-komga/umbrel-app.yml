releaseNotes: >-
  Primera versión de Komga para la tienda JADELAMO.
  Utiliza la imagen oficial de Komga, conserva su configuración
  en el almacenamiento de la aplicación y permite seleccionar
  las bibliotecas desde la carpeta Contenidos del disco externo 2TB.


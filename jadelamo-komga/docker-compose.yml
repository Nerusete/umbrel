services:
  komga:
    image: gotson/komga:latest
    container_name: jadelamo-komga
    restart: unless-stopped
    user: "1000:1000"

    ports:
      - "25600:25600"

    environment:
      TZ: Europe/Madrid

    volumes:
      # Configuración, base de datos y estado de Komga
      - ${APP_DATA_DIR}/data/config:/config

      # Contenidos del disco externo 2TB
      # Las bibliotecas se seleccionan desde la interfaz de Komga.
      - ${UMBREL_ROOT}/external/2T/Contenidos:/data:ro

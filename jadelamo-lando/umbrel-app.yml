manifestVersion: 1

id: jadelamo-lando
name: Lando
tagline: Entorno de desarrollo local basado en Docker
icon: https://raw.githubusercontent.com/Nerusete/umbrel/main/jadelamo-lando/icon.svg
category: developer
version: "1.0.2"
port: 7681

description: >-
  Lando es una herramienta de desarrollo basada en Docker para crear
  entornos locales reproducibles para PHP, WordPress, Drupal, Laravel,
  Node.js y otros proyectos.

  Esta versión está preparada para Umbrel GO y permite ejecutar Lando
  directamente contra el Docker Engine de Umbrel.


submission: https://github.com/Nerusete/umbrel

gallery: []

releaseNotes: >-
  Corrección de instalación para umbrelOS 2.0.
  La imagen se publica en GHCR y se descarga directamente, sin build local.
  Incluye Lando CLI, Docker CLI, Docker Compose y terminal web.


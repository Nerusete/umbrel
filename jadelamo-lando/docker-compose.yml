services:
  lando:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nerusete-lando
    restart: unless-stopped
    init: true
    privileged: false

    ports:
      - "7681:7681"

    environment:
      TZ: Europe/Madrid
      LANDO_HOME: /root/.lando
      DOCKER_HOST: unix:///var/run/docker.sock

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/umbrel/umbrel/data/storage/lando-projects:/home/umbrel/umbrel/data/storage/lando-projects:rw
      - ${APP_DATA_DIR}/data/lando:/root/.lando:rw

    working_dir: /home/umbrel/umbrel/data/storage/lando-projects

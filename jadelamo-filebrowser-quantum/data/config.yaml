server:
  port: 80
  cacheDir: /home/filebrowser/data/tmp
  sources:
    - name: Archivos
      path: /srv
      config:
        defaultEnabled: true

  database:
    path: /home/filebrowser/data/filebrowser.sqlite

auth:
  tokenExpirationHours: 2
  methods:
    noauth: false
    password:
      enabled: true
      adminUsername: admin
      adminPassword: admin
      signup: false

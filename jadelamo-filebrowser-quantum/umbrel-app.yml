manifestVersion: 1
id: jadelamo-filebrowser-quantum
name: FileBrowser Quantum
tagline: A better filebrowser than Filebrowser
icon: https://raw.githubusercontent.com/Nerusete/umbrel/main/jadelamo-filebrowser-quantum/icon.svg
category: files & productivity
version: "2.1.0-beta"
port: 8633
description: >-
  Filebrowser Quantum es un gestor de archivos web moderno y avanzado.
  Permite subir, descargar, mover, renombrar, eliminar y editar archivos
  directamente desde el navegador, con búsqueda rápida y gestión de usuarios.
developer: Graham Steffaniak
website: https://github.com/gtsteffaniak/filebrowser
submitter: Nerusete
submission: https://github.com/Nerusete/umbrel
repo: https://github.com/gtsteffaniak/filebrowser
support: https://github.com/gtsteffaniak/filebrowser/issues
gallery: []
releaseNotes: >-
  Versión beta 2.1.0 adaptada al nuevo sistema de configuración y base de datos
  SQLite de FileBrowser Quantum v2. Utiliza autenticación por contraseña con
  usuario admin y contraseña admin y mantiene el almacenamiento de Umbrel.
dependencies:
path: ""
defaultUsername: admin
defaultPassword: admin

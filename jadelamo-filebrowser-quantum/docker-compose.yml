version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: jadelamo-filebrowser-quantum_web_1
      APP_PORT: 80

  web:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.0-beta
    restart: on-failure
    volumes:
      - ${UMBREL_ROOT}/data/storage:/storage
      - ${APP_DATA_DIR}/data/database:/home/filebrowser/data
      - ${APP_DATA_DIR}/data/config/config.yaml:/home/filebrowser/data/config.yaml

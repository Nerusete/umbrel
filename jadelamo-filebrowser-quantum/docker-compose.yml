services:
  filebrowser:
    container_name: jadelamo-filebrowser-quantum
    image: gtstef/filebrowser:1.5.6-stable
    restart: unless-stopped

    environment:
      FILEBROWSER_CONFIG: "/home/filebrowser/data/config.yaml"
      TZ: Europe/Madrid

    volumes:
      - ./files:/srv
      - ./data:/home/filebrowser/data

    ports:
      - "10700:80"

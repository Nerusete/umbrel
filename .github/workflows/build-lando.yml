name: Build Lando image

on:
  push:
    branches:
      - main
    paths:
      - "jadelamo-lando/**"
      - ".github/workflows/build-lando.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./jadelamo-lando
          file: ./jadelamo-lando/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nerusete/jadelamo-lando:1.0.2

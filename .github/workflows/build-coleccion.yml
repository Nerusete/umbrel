name: Build Colección image

on:
  push:
    branches: [main]
    paths:
      - "jadelamo-coleccion/**"
      - ".github/workflows/build-coleccion.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./jadelamo-coleccion
          file: ./jadelamo-coleccion/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nerusete/jadelamo-coleccion:1.0.2
            ghcr.io/nerusete/jadelamo-coleccion:latest
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/jadelamo-coleccion -f visibility=public || true
